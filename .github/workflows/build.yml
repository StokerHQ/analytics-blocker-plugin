name: build

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Every target in stoker-plugin.yaml, built by the SDK's reusable workflow against the SDK release it pins.
  build:
    uses: StokerHQ/plugin-sdk/.github/workflows/build-hook-plugin.yml@v1.0.2

  # The compiled-in table is what rules/hosts.yaml generates, and the rules pass the generator's checks.
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The generated table is current
        run: python3 tools/gen_rules.py --check

  tests-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Core tests
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "call `"$vs\VC\Auxiliary\Build\vcvarsall.bat`" ${{ matrix.arch }} >nul && cl /nologo /utf-8 /std:c++20 /EHsc /W4 /WX /MT /Od tests\core_tests.cpp /Fe:tests.exe && tests.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  tests-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Core tests
        run: g++ -std=c++20 -O2 -Wall -Wextra -Werror tests/core_tests.cpp -o tests.out && ./tests.out

  # A published release gets the built files as its assets, under the names the registry entry lists. The tag must be
  # v<version> of the version the manifest (src/manifest.h, shared by every target) declares.
  release:
    if: github.event_name == 'release'
    needs: [build, rules, tests-windows, tests-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag is the manifest's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(grep -oP '"version":\s*"\K[^"]+' src/manifest.h | head -n1)
          if [ "v$version" != "$TAG" ]; then echo "src/manifest.h declares $version, the tag is $TAG"; exit 1; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin-*
          merge-multiple: true
          path: out
      - name: Attach the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l out
          gh release upload "$TAG" out/* --clobber
